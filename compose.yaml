# One setup for everyone: the same images run the course examples in CI.
#   docker compose run --rm php php tools/check.php      PHP 8.6
#   docker compose run --rm php85 composer verify        PHP 8.5
#   docker compose up web                                Shelf in the browser (chapter 45), and Mailpit (82)
#   docker compose up web worker                         and the worker that sends the emails (85)
#   docker compose up -d --wait db                       MariaDB, for chapter 59 (stop it: docker compose stop db)

# The database users' passwords (chapter 59). They are for the database in Docker on your computer,
# which only these containers can reach; real secrets never go into a file in Git (chapter 65).
x-db-passwords: &db-passwords
  SHELF_ADMIN_PASSWORD: local-only-admin
  SHELF_APP_PASSWORD: local-only-app

x-php: &php
  # Files you create stay yours, not root's. On Linux, if `id -u` is not 1000:
  #   export HOST_UID=$(id -u) HOST_GID=$(id -g)
  user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
  volumes: [".:/app"]
  working_dir: /app
  environment: *db-passwords

services:
  php:
    <<: *php
    build: { context: ., args: { PHP: 8.6-cli } }
    image: php-0-to-hero:8.6
  php85:
    <<: *php
    build: { context: ., args: { PHP: 8.5-cli } }
    image: php-0-to-hero:8.5
  # Shelf's web pages at http://localhost:8000, with PHP's built-in server. Stop it with Ctrl+C.
  # 0.0.0.0: answer requests from outside the container; 127.0.0.1 below: only from this computer.
  # index.php is the router (chapter 80): every request goes to Symfony, which also serves the
  # stylesheet from assets/ while you work, under its versioned name.
  web:
    <<: *php
    build: { context: ., args: { PHP: 8.6-cli } }
    image: php-0-to-hero:8.6
    command: php -S 0.0.0.0:8000 -t shelf/public shelf/public/index.php
    ports: ["127.0.0.1:8000:8000"]
    depends_on: [mailpit]
  # The worker (chapter 85): it takes messages from the queue (emails) and from Shelf's schedule
  # (reminders every hour, expired reservations every night), one after the other. --time-limit: it
  # stops after an hour, and Docker starts a new one, which reads any changed code and settings.
  worker:
    <<: *php
    build: { context: ., args: { PHP: 8.6-cli } }
    image: php-0-to-hero:8.6
    command: php shelf/bin/console messenger:consume async scheduler_shelf --time-limit=3600 -vv
    restart: unless-stopped
    depends_on: [mailpit]
  # Mailpit (chapter 82): an inbox for every email Shelf sends while you work, at http://localhost:8025.
  # Nothing it receives leaves your computer.
  mailpit:
    image: axllent/mailpit:v1.29
    ports: ["127.0.0.1:8025:8025"]
  # MariaDB (chapter 59), a database server, in its long-term support version. It has no ports:
  # only the containers above can reach it, by the name db. The data stays in the volume db-data
  # until: docker compose down -v
  db:
    image: mariadb:11.8
    environment:
      <<: *db-passwords
      MARIADB_DATABASE: shelf
      MARIADB_RANDOM_ROOT_PASSWORD: "1" # nobody needs root; docker/db/users.sh makes the two users
    volumes: ["db-data:/var/lib/mysql", "./docker/db:/docker-entrypoint-initdb.d:ro"]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      retries: 30

volumes:
  db-data:
