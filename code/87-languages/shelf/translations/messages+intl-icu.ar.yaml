"{days, plural, =0 {due today} =1 {due tomorrow} other {due in # days}}": "{days, plural, =0 {موعده اليوم} =1 {موعده غدًا} =2 {موعده بعد يومين} few {موعده بعد # أيام} many {موعده بعد # يومًا} other {موعده بعد # يوم}}"
"{days, plural, one {# day late} other {# days late}}": "{days, plural, one {متأخرة يومًا واحدًا} two {متأخرة يومين} few {متأخرة # أيام} many {متأخرة # يومًا} other {متأخرة # يوم}}"
"{days, plural, one {# day overdue} other {# days overdue}}": "{days, plural, one {متأخر يومًا واحدًا} two {متأخر يومين} few {متأخر # أيام} many {متأخر # يومًا} other {متأخر # يوم}}"
"{days, plural, one {out, # day late} other {out, # days late}}": "{days, plural, one {مُعارة، متأخرة يومًا واحدًا} two {مُعارة، متأخرة يومين} few {مُعارة، متأخرة # أيام} many {مُعارة، متأخرة # يومًا} other {مُعارة، متأخرة # يوم}}"
"{day}: what needs doing, and how the library is used.": "{day}: ما يجب فعله، وكيف تُستخدم المكتبة."
"{email}, for {name}.": "{email}، للعضو {name}."
"{name} has \"{title}\" already.": "لدى {name} «{title}» بالفعل."
"{name} has reserved \"{title}\" already.": "حجز {name} «{title}» بالفعل."
"{name} has {count} books already: that is the most {role, select, staff {a member of staff} other {a reader}} may have.": "لدى {name} {count, plural, one {كتاب واحد} two {كتابان} few {# كتب} many {# كتابًا} other {# كتاب}} بالفعل: وهذا أقصى ما يحق {role, select, staff {للموظف} other {للقارئ}}."
"{name} is blocked, and can't borrow books.": "{name} موقوف، ولا يستطيع استعارة الكتب."
"{name} is blocked, and can't reserve books.": "{name} موقوف، ولا يستطيع حجز الكتب."
"{name} is blocked: they can't borrow until you unblock them.": "أُوقف {name}: لا يستطيع الاستعارة حتى تلغي الإيقاف."
"{name} is {role, select, staff {a member of staff} other {a reader}} now.": "أصبح {name} {role, select, staff {موظفًا} other {قارئًا}}."
"{name} may borrow again.": "يحق لـ {name} الاستعارة من جديد."
"{returned, plural, one {# loan came back} other {# loans came back}}, {late} of them late.": "{returned, plural, zero {لم تُعَد أي إعارة} one {أُعيدت إعارة واحدة} two {أُعيدت إعارتان} few {أُعيدت # إعارات} many {أُعيدت # إعارة} other {أُعيدت # إعارة}}، منها {late} متأخرة."
"{title} is back from {member}": "أُعيد {title} من {member}"
"“{title}” is due back on {day, date, ::EEEEdMMMM}": "موعد إرجاع «{title}» {day, date, ::EEEEdMMMM}"
"“{title}” is due back on {day}. You can extend it on your loans page, unless someone has reserved it.": "موعد إرجاع «{title}» هو {day}. يمكنك تمديد الإعارة من صفحة إعاراتك، ما لم يحجزه أحد."
"“{title}” is waiting for you at the desk, until {day, date, ::EEEEdMMMM}": "«{title}» بانتظارك في مكتب الإعارة حتى {day, date, ::EEEEdMMMM}"
"“{title}” was due back on {day, date, ::EEEEdMMMM}": "كان موعد إرجاع «{title}» {day, date, ::EEEEdMMMM}"
"“{title}” was due back on {day}. Please bring it back to the library: someone may be waiting for it.": "كان موعد إرجاع «{title}» هو {day}. يُرجى إعادته إلى المكتبة: ربما ينتظره أحد."
"← All books": "→ كل الكتب"
"← Dashboard": "→ لوحة التحكم"
