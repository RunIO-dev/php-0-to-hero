"\"{title}\" is overdue: please bring it back to the library.": "«{title}» متأخر: يُرجى إعادته إلى المكتبة."
"\"{title}\" is reserved by another member, so it can't be extended: please bring it back by {due, date, full}.": "حجز عضو آخر «{title}»، فلا يمكن تمديده: يُرجى إعادته بحلول {due, date, full}."
"\"{title}\" is reserved, so it can't be removed.": "«{title}» محجوز، فلا يمكن إزالته."
"\"{title}\" was extended {count} times already, which is the most.": "مُدِّد «{title}» {count, plural, one {مرة واحدة} two {مرتين} few {# مرات} other {# مرة}} بالفعل، وهذا الحد الأقصى."
