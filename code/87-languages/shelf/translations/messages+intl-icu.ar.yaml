# Shelf's texts in Arabic. The keys are the English texts (ICU MessageFormat).
"\"{title}\" is already on the shelf": "«{title}» على الرف بالفعل"
"\"{title}\" is back already.": "أُعيد «{title}» بالفعل."
"\"{title}\" is back from {member}.": "أُعيد «{title}» من {member}."
"\"{title}\" is back from {member}. Please set it aside for {next}, who reserved it.": "أُعيد «{title}» من {member}. يُرجى حفظه لـ {next}، الذي حجزه."
"\"{title}\" is now due back on {due, date, full}.": "موعد إرجاع «{title}» الآن {due, date, full}."
"\"{title}\" is on loan, so it can't be removed.": "«{title}» مُعار، فلا يمكن إزالته."
