# Symfony Messenger (chapter 85). A message is a small object that says what to do; its handler does
# it. Messages sent to async wait in the database, in the table messenger_messages, until a worker
# takes them:
#   php bin/console messenger:consume async scheduler_shelf
# A message whose handler fails is tried again, three times, a minute and then longer apart. After
# that it goes to failed, to look at (messenger:failed:show) and to try once more (messenger:failed:retry).
framework:
    messenger:
        failure_transport: failed
        transports:
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                retry_strategy: { max_retries: 3, delay: 60000, multiplier: 5 }
            failed: 'doctrine://default?queue_name=failed&auto_setup=0'
        routing:
            # Every email, chapter 82's too, waits in the queue: a page never waits for the mail server.
            Symfony\Component\Mailer\Messenger\SendEmailMessage: async

# In the tests, the queue is handled at once, in the test itself: assertEmailCount() sees each email.
when@test:
    framework:
        messenger:
            transports:
                async: 'sync://'
