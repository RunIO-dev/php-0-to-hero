; Shelf's PHP settings in production (chapter 78), after php.ini-production, which already turns
; display_errors off and log_errors on: a visitor never sees an error, the log always does.

; Don't tell the world which PHP this is.
expose_php = Off

; OPcache keeps the compiled code in memory. The code in the image never changes, so PHP never needs
; to check the files again: a new version is a new image, and a new container.
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
; Symfony's list of the classes every request needs, loaded once when PHP-FPM starts.
opcache.preload = /app/config/preload.php
opcache.preload_user = www-data

realpath_cache_size = 4096K
realpath_cache_ttl = 600
